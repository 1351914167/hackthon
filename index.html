<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="雾隐镇：由灵汐 API 驱动的中文语音狼人杀。" />
    <title>雾隐镇 · 语音狼人杀</title>
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="ambient" aria-hidden="true"></div>

    <header class="topbar">
      <a class="brand" href="./index.html" aria-label="返回雾隐镇入口">
        <span class="brand-mark" aria-hidden="true">雾</span>
        <span><strong>雾隐镇</strong><small>VOICE WEREWOLF</small></span>
      </a>
      <div class="room-meta" id="roomMeta" aria-live="polite"></div>
      <nav class="top-actions" aria-label="全局工具">
        <button class="icon-button" id="rulesButton" type="button" aria-label="查看本局规则" title="本局规则">?</button>
        <a class="icon-button" href="./product.html" aria-label="查看产品蓝图" title="产品蓝图">⌘</a>
        <div class="voice-status" id="voiceStatus" role="status">
          <span class="status-dot" aria-hidden="true"></span><span>检查灵汐</span>
        </div>
      </nav>
    </header>

    <main id="app" class="app-root" aria-live="off">
      <section class="loading-screen" aria-busy="true">
        <span class="loading-mark" aria-hidden="true">雾</span>
        <p>正在连接雾隐镇</p>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="alert-region" id="alertRegion" role="alert" aria-live="assertive"></div>
    <audio id="remoteVoice" class="remote-voice" autoplay></audio>

    <dialog class="rules-dialog" id="rulesDialog" aria-labelledby="rulesTitle">
      <div class="dialog-header">
        <div><span class="eyebrow">standard-9-v1</span><h2 id="rulesTitle">9 人标准局</h2></div>
        <button class="icon-button" id="closeRules" type="button" aria-label="关闭规则">×</button>
      </div>
      <div class="rule-grid">
        <section><span class="rule-count">3</span><h3>狼人</h3><p>每晚严格多数选择袭击目标。</p></section>
        <section><span class="rule-count">3</span><h3>神职</h3><p>预言家、女巫、猎人各一名。</p></section>
        <section><span class="rule-count">3</span><h3>平民</h3><p>通过发言与公投找出狼人。</p></section>
      </div>
      <div class="rule-copy">
        <h3>胜负与流程</h3>
        <p>好人放逐全部狼人获胜；狼人数量达到或超过其余存活玩家时获胜。放逐后先进行遗言，猎人符合条件时再开枪，最后判定胜负。</p>
      </div>
    </dialog>

    <script src="./src/client/core.js" defer></script>
    <script src="./src/client/api.js" defer></script>
    <script src="./src/client/voice.js" defer></script>
    <script src="./src/client/view.js" defer></script>
    <script src="./src/client/app.js" defer></script>
    <script src="./app.js" defer></script>
  </body>
</html>
